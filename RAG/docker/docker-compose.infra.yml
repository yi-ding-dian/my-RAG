# ============================================================
# docker/docker-compose.infra.yml — my-RAG 外部基础服务（可选）
# 一键起齐 MySQL 8 + MinIO，端口与系统配置页默认一致。
#
# 用法:
#   docker compose -f docker/docker-compose.infra.yml up -d          # 起 MySQL + MinIO
#   docker compose -f docker/docker-compose.infra.yml up -d mysql    # 只起某一个
#   docker compose -f docker/docker-compose.infra.yml down           # 停止（数据卷保留）
#
# 重要:
#   1. 口令均为占位符，使用前必须改为强口令（改完与 docker/.env.docker
#      中 MYSQL_PASSWORD / MINIO_ACCESS_KEY / MINIO_SECRET_KEY 保持一致）
#   2. 宿主机同机部署时，docker/.env.docker 中 MYSQL_HOST=127.0.0.1、
#      MINIO_ENDPOINT=127.0.0.1:9000 即指向本编排（无需修改）
#   3. MySQL 是硬前置（登录/多租户必需）；MinIO 可用 STORAGE_BACKEND=local
#      替代（对象存本地 data/storage），详见 docs/external-deps.md
#   4. 数据卷持久化在 docker/volumes/ 下（mysql-data / minio-data），
#      down 不删数据；彻底删除请 docker compose down -v（慎用）
# ============================================================

services:
  # ---------- MySQL 8（多租户 users/departments/kbs 三表，端口 5455） ----------
  mysql:
    image: mysql:8
    container_name: my-rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: <your-password>
      MYSQL_DATABASE: my_rag
      MYSQL_USER: ragflow
      MYSQL_PASSWORD: <your-password>
    ports:
      - "5455:3306"          # 系统配置页默认 MYSQL_PORT=5455
    volumes:
      - ./volumes/mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p<your-password>"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- MinIO 对象存储（API 9000 + 控制台 9001） ----------
  minio:
    image: minio/minio
    container_name: my-rag-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: <your-access-key>
      MINIO_ROOT_PASSWORD: <your-secret-key>
    ports:
      - "9000:9000"          # S3 API，系统配置页默认 MINIO_ENDPOINT=127.0.0.1:9000
      - "9001:9001"          # Web 控制台
    volumes:
      - ./volumes/minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
