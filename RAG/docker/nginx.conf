# ============================================================
# nginx.conf — my-RAG 前端（生产）
# 职责：SPA 静态托管 + /api 反向代理到后端 rag-backend（含 SSE 流式透传）
# 挂载位置：/etc/nginx/conf.d/default.conf（frontend/Dockerfile 中 COPY）
# ============================================================

server {
    listen 80;
    server_name _;

    # 前端静态资源根目录（Dockerfile 中 dist 复制于此）
    root /usr/share/nginx/html;
    index index.html;

    # ---------- SPA 路由回退 ----------
    # 非文件请求（如 /chat /settings 等前端路由）一律返回 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理到后端 ----------
    # docker compose 默认网络内以服务名 rag-backend 解析（端口 8091）
    location /api/ {
        proxy_pass http://rag-backend:8091;
        proxy_http_version 1.1;

        # ---- SSE 流式关键配置（流式问答逐字输出必须，缺一不可）----
        # 关闭代理缓冲：SSE 事件实时透传，否则被 nginx 攒批延迟
        proxy_buffering off;
        proxy_cache off;
        # 长连接读取超时：LLM 流式生成可能超过 nginx 默认 60s
        proxy_read_timeout 300s;
        # 清空请求头 Connection，配合 HTTP/1.1 走 upstream keep-alive
        proxy_set_header Connection '';

        # 透传标准请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传限制：文档上传（扫描版 PDF 可能较大），默认 1m 不够；
        # 反代层上限取"最大允许"（1024m），单文件精确大小由后端按配置档案
        # ingestion.max_upload_mb 校验（默认 100MB，超管可调）
        client_max_body_size 1024m;
    }
}

