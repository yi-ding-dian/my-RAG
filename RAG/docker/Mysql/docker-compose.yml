version: '3.8'

services:
  mysql:
    image: mysql:8.0                # 使用官方 MySQL 8.0 镜像
    container_name: mysql-server
    restart: unless-stopped         # 容器异常退出时自动重启
    environment:
      MYSQL_ROOT_PASSWORD: my_app_root_123456  # 必填，设置 root 密码
      MYSQL_DATABASE: my_app_rag                        # 可选，首次启动时创建数据库
      MYSQL_USER: app_rag                             # 可选，创建普通用户
      MYSQL_PASSWORD: app_rag_123456        # 可选，设置普通用户密码
    ports:
      - "8100:3306"                 # 将宿主机的 8100 端口映射到容器
    volumes:
      - ./data:/var/lib/mysql       # 挂载数据目录，实现持久化
      - ./conf/my.cnf:/etc/mysql/conf.d/my.cnf  # 挂载自定义配置文件
    networks:
      - mysql-network               # 加入自定义网络，便于其他容器连接

networks:
  mysql-network:
    driver: bridge